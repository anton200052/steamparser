<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Steam Parser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- ваш кастомный CSS -->
    <link rel="stylesheet" th:href="@{/css/control.css}" />
</head>
<body>
<div class="parser-wrapper text-center">
    <div class="custom-card text-center">
        <a th:unless="${isParsingStarted}"
           class="btn btn-custom-on mb-3"
           th:href="@{/parsing/enable}">
            Запустить парсинг
        </a>
        <a th:if="${isParsingStarted}"
           class="btn btn-custom-off mb-3"
           th:href="@{/parsing/disable}">
            Остановить парсинг
        </a>

        <p class="mt-3 status-text">
            Статус парсинга:
            <span th:if="${isParsingStarted}">
                <span class="status-circle">🟢</span> Включен
            </span>
            <span th:unless="${isParsingStarted}">
                <span class="status-circle">🔴</span> Выключен
            </span>
        </p>
    </div>

    <div th:if="${infoMsg != null and !#strings.isEmpty(infoMsg)}"
         class="parser-alert"
         th:text="${infoMsg}">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-2ZtJ5Zyrr5U2z86Sv95TQ+jzRDOxxPTkHu/f8WC9crJgE9I39et5qW6fS1VPVw11"
        crossorigin="anonymous"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    setTimeout(()=>document.querySelector('.custom-flash')?.remove(),5500);
    /*]]>*/
</script>

</body>
</html>
